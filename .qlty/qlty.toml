config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/.yarn/**",
    "**/*.d.ts",
    "**/assets/**",
    "**/bower_components/**",
    "**/build/**",
    "**/cache/**",
    "**/db/**",
    "**/deps/**",
    "**/dist/**",
    "**/extern/**",
    "**/external/**",
    "**/generated/**",
    "**/Godeps/**",
    "**/gradlew/**",
    "**/mvnw/**",
    "**/node_modules/**",
    "**/protos/**",
    "**/seed/**",
    "**/target/**",
    "**/templates/**",
    "**/testdata/**",
    "**/vendor/**",
    ".qlty/configs/**",
    ".sinemacula/**"
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*"
]

[runtimes.enabled]
php = "8.3"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.24.0"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "checkov"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
# 4.0.1 carries a command-injection advisory; 4.0.2 is the first release without
# it, so a fresh install cannot resolve anything older.
version = "4.0.4"
mode = "comment"
package_file = ".qlty/configs/composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# phpcs 4.x exits 3 on findings; without this qlty treats that as a hard error
# and drops every finding instead of reporting them.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

[[plugin]]
name = "php-cs-fixer"
version = "3.95.25"
# The symfony pins hold the fixer's dependencies on the 7.x line. From 3.90 it
# accepts symfony 8, which requires PHP 8.4.1 and uses 8.4-only syntax that the
# PHP 8.3 runner cannot parse. They have to live here because a package file on
# this plugin would make these entries be ignored.
extra_packages = [
    "sinemacula/coding-standards@1.24.0",
    "symfony/console@^7.4",
    "symfony/event-dispatcher@^7.4",
    "symfony/filesystem@^7.4",
    "symfony/finder@^7.4",
    "symfony/options-resolver@^7.4",
    "symfony/process@^7.4",
    "symfony/stopwatch@^7.4",
    "symfony/string@^7.4",
]

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "phpstan"
# Matches the version composer resolves from the package file. The tool sandbox
# is keyed on this string, so a stale label also means sharing a sandbox with
# any other repository still on it, whatever that one declares.
version = "2.2.13"
package_file = ".qlty/configs/composer.json"
package_filters = ["phpstan", "larastan", "sinemacula"]

# Without this the repository's phpstan.neon is never passed to phpstan, and
# its ignoreErrors entries silently do nothing.
[plugins.definitions.phpstan]
config_files = ["phpstan.neon"]

# phpstan resolves framework symbols by autoloading the package's own
# dependencies, which a bare checkout does not have, so install them first.
# COMPOSER_VENDOR_DIR is pinned to the repository's vendor directory because
# the plugin environment points it at the shared phpstan tool sandbox, where an
# install would replace the pinned analysis stack. Only extension requirements
# are ignored so the PHP version constraint still applies.
[plugins.definitions.phpstan.drivers.lint]
prepare_script = "COMPOSER_VENDOR_DIR=vendor ~/.qlty/cache/tools/composer/generic-42cc848a9f5e/composer.phar install --no-scripts --ignore-platform-req='ext-*'"
